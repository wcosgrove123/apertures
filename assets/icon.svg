<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#115740"/>
      <stop offset="100%" stop-color="#0B2E22"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- topographic contour lines, gold, subtle -->
  <g fill="none" stroke="#B9975B" stroke-width="2" opacity="0.5">
    <path d="M 40 380 C 120 360, 200 400, 280 380 S 440 360, 520 390"/>
    <path d="M 30 410 C 110 395, 195 425, 275 410 S 440 395, 520 420"/>
    <path d="M 30 440 C 120 425, 200 450, 280 440 S 440 430, 520 450"/>
    <path d="M 30 470 C 130 460, 210 480, 290 470 S 440 460, 520 478"/>
  </g>

  <!-- aperture iris -->
  <g transform="translate(256,236)">
    <!-- outer ring -->
    <circle r="138" fill="none" stroke="#B9975B" stroke-width="6" opacity="0.9"/>
    <!-- iris blades -->
    <g fill="#FAF6EE" stroke="none">
      <polygon points="0,-118 -34,-10 102,-58" transform="rotate(0)"/>
      <polygon points="0,-118 -34,-10 102,-58" transform="rotate(60)"/>
      <polygon points="0,-118 -34,-10 102,-58" transform="rotate(120)"/>
      <polygon points="0,-118 -34,-10 102,-58" transform="rotate(180)"/>
      <polygon points="0,-118 -34,-10 102,-58" transform="rotate(240)"/>
      <polygon points="0,-118 -34,-10 102,-58" transform="rotate(300)"/>
    </g>
    <!-- center opening -->
    <circle r="34" fill="#0B2E22"/>
    <circle r="34" fill="none" stroke="#B9975B" stroke-width="2"/>
  </g>
</svg>
